name: iOS Build & Upload to TestFlight

on:
  push:
    branches:
      - ios_build
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Prebuild iOS Flutter files
        run: |
          echo "🛠️ Preparing iOS Flutter files..."
          mkdir -p ios/Flutter
          echo '<?xml version="1.0" encoding="UTF-8"?>' > ios/Flutter/AppFrameworkInfo.plist
          echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> ios/Flutter/AppFrameworkInfo.plist
          echo '<plist version="1.0"><dict></dict></plist>' >> ios/Flutter/AppFrameworkInfo.plist
          echo "✅ Created ios/Flutter/AppFrameworkInfo.plist manually."

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Ensure Flutter iOS config files exist
        run: |
          echo "⚙️ Ensuring iOS config files exist..."
          mkdir -p ios/Flutter
          for config in Debug Release Profile; do
            if [ ! -f "ios/Flutter/${config}.xcconfig" ]; then
              echo "#include \"Generated.xcconfig\"" > ios/Flutter/${config}.xcconfig
              echo "✅ Created ios/Flutter/${config}.xcconfig"
            else
              echo "✅ ios/Flutter/${config}.xcconfig already exists."
            fi
          done

      - name: Build IPA (Release)
        run: |
          echo "🏗️ Building release IPA..."
          flutter build ipa --release --no-codesign
          echo "✅ IPA build complete."

      - name: Export IPA manually
        run: |
          echo "📦 Exporting IPA from archive..."
          ARCHIVE_PATH=$(find build/ios -type d -name "Runner.xcarchive" | head -n 1)
          if [ -z "$ARCHIVE_PATH" ]; then
            echo "❌ Runner.xcarchive not found!"
            exit 1
          fi
          echo "📂 Found archive at: $ARCHIVE_PATH"
          mkdir -p build/ios/ipa
          cp -R "$ARCHIVE_PATH/Products/Applications/Runner.app" build/ios/ipa/
          cd build/ios/ipa
          zip -r Runner.ipa Runner.app
          echo "✅ Created Runner.ipa for upload"

      - name: Upload IPA to TestFlight
        env:
          APPLE_ID: ${{ secrets.APP_STORE_EMAIL }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_STORE_PASSWORD }}
        run: |
          echo "🚀 Uploading IPA to TestFlight..."
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "❌ No IPA file found! Build may have failed."
            exit 1
          fi
          echo "📦 Found IPA: $IPA_PATH"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --username "$APPLE_ID" \
            --password "$APP_SPECIFIC_PASSWORD" || exit 1
          echo "✅ Upload complete! Check App Store Connect → TestFlight."
