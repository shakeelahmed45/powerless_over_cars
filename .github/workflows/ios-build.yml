name: iOS Build

on:
  push:
    branches:
      - ios_build
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Flutter Clean and Get Packages
        run: |
          flutter clean
          flutter pub get
          flutter precache --ios

      - name: Generate iOS Configs
        run: |
          mkdir -p ios/Flutter
          echo "#include \"Generated.xcconfig\"" > ios/Flutter/Debug.xcconfig
          echo "#include \"Generated.xcconfig\"" > ios/Flutter/Release.xcconfig
          echo "#include \"Generated.xcconfig\"" > ios/Flutter/Profile.xcconfig

      - name: Install CocoaPods
        run: |
          cd ios
          pod repo update
          pod install
          cd ..

      - name: Build iOS App
        run: |
          flutter build ios --debug --no-codesign

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphoneos/
