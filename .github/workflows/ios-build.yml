name: iOS Build and Upload

on:
  push:
    branches:
      - ios_build
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Prebuild iOS Flutter files
        run: |
          echo "🛠️ Preparing iOS Flutter files..."
          mkdir -p ios/Flutter
          echo '<?xml version="1.0" encoding="UTF-8"?>' > ios/Flutter/AppFrameworkInfo.plist
          echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> ios/Flutter/AppFrameworkInfo.plist
          echo '<plist version="1.0"><dict></dict></plist>' >> ios/Flutter/AppFrameworkInfo.plist
          echo "✅ Created ios/Flutter/AppFrameworkInfo.plist manually."

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Ensure Flutter iOS config files exist
        run: |
          echo "⚙️ Ensuring iOS config files exist..."
          mkdir -p ios/Flutter
          for config in Debug Release Profile; do
            if [ ! -f "ios/Flutter/${config}.xcconfig" ]; then
              echo "#include \"Generated.xcconfig\"" > ios/Flutter/${config}.xcconfig
              echo "✅ Created ios/Flutter/${config}.xcconfig"
            else
              echo "✅ ios/Flutter/${config}.xcconfig already exists."
            fi
          done

      - name: Build iOS App (Release)
        run: flutter build ipa --release --no-codesign

      # ✅ Upload the IPA to App Store Connect / TestFlight
      - name: Upload to App Store Connect
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: build/ios/ipa/*.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          bundle-id: ${{ secrets.BUNDLE_ID }}

      - name: ✅ Success
        run: echo "🎉 iOS Build and Upload completed successfully!"
