name: iOS Build and Upload to TestFlight

on:
  push:
    branches:
      - ios_build
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Prepare iOS Flutter files
        run: |
          echo "🛠️ Preparing iOS Flutter files..."
          mkdir -p ios/Flutter
          echo '<?xml version="1.0" encoding="UTF-8"?>' > ios/Flutter/AppFrameworkInfo.plist
          echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> ios/Flutter/AppFrameworkInfo.plist
          echo '<plist version="1.0"><dict></dict></plist>' >> ios/Flutter/AppFrameworkInfo.plist
          echo "✅ Created ios/Flutter/AppFrameworkInfo.plist manually."

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Ensure iOS config files exist
        run: |
          echo "⚙️ Ensuring iOS config files exist..."
          mkdir -p ios/Flutter
          for config in Debug Release Profile; do
            if [ ! -f "ios/Flutter/${config}.xcconfig" ]; then
              echo "#include \"Generated.xcconfig\"" > ios/Flutter/${config}.xcconfig
              echo "✅ Created ios/Flutter/${config}.xcconfig"
            else
              echo "✅ ios/Flutter/${config}.xcconfig already exists."
            fi
          done

      # 🏗️ Build the .ipa file
      - name: Build iOS IPA
        run: |
          flutter build ipa --release --no-codesign
          echo "✅ IPA build complete. Checking if file exists:"
          ls -lh build/ios/ipa || true

      # 🚀 Upload to App Store Connect using Apple’s transporter tool
      - name: Upload to TestFlight
        env:
          APPLE_ID: ${{ secrets.APP_STORE_EMAIL }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_STORE_PASSWORD }}
        run: |
          echo "🚀 Uploading IPA to TestFlight..."
          xcrun altool --upload-app \
            --type ios \
            --file "$(find build/ios/ipa -name '*.ipa' | head -n 1)" \
            --username "$APPLE_ID" \
            --password "$APP_SPECIFIC_PASSWORD"
          echo "✅ Upload complete! Check App Store Connect > TestFlight."
