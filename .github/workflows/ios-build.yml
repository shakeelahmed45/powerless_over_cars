name: iOS Build & Upload to TestFlight (Stable No-Clean)

on:
  push:
    branches:
      - ios_build
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest

    steps:
      - name: 🧭 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🧩 Prepare iOS Config Files
        run: |
          echo "🛠️ Preparing iOS Flutter files..."
          mkdir -p ios/Flutter
          if [ ! -f "ios/Flutter/AppFrameworkInfo.plist" ]; then
            echo '<?xml version="1.0" encoding="UTF-8"?>' > ios/Flutter/AppFrameworkInfo.plist
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> ios/Flutter/AppFrameworkInfo.plist
            echo '<plist version="1.0"><dict></dict></plist>' >> ios/Flutter/AppFrameworkInfo.plist
            echo "✅ Created ios/Flutter/AppFrameworkInfo.plist"
          else
            echo "✅ AppFrameworkInfo.plist already exists."
          fi

      - name: 🍫 Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: 🔐 Setup Signing Certificates & Provisioning Profiles
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "🔐 Setting up signing assets..."
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/PowerlessOverCarsProfile.mobileprovision
          echo "$P12_BASE64" | base64 --decode > /tmp/distribution.p12
          security create-keychain -p "" build.keychain
          security list-keychains -s ~/Library/Keychains/build.keychain
          security default-keychain -s ~/Library/Keychains/build.keychain
          security unlock-keychain -p "" ~/Library/Keychains/build.keychain
          security import /tmp/distribution.p12 -k ~/Library/Keychains/build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          echo "✅ Code signing assets installed."

      - name: 🏗️ Build and Archive iOS App
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
        run: |
          echo "🏗️ Building Flutter app..."
          flutter build ios --release --no-codesign

          echo "📦 Archiving app with team metadata but without signing Pods..."
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/Runner.xcarchive \
            -destination 'generic/platform=iOS' \
            archive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            OTHER_CODE_SIGN_FLAGS="--keychain ~/Library/Keychains/build.keychain" \
            EXCLUDED_ARCHS=armv7 \
            -allowProvisioningUpdates

      - name: 📝 Write ExportOptions (Manual signing)
        env:
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
        run: |
          echo "📝 Creating exportOptions.plist..."
          rm -f ios/exportOptions.ci.plist
          echo '<?xml version="1.0" encoding="UTF-8"?>' > ios/exportOptions.ci.plist
          echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> ios/exportOptions.ci.plist
          echo '<plist version="1.0"><dict>' >> ios/exportOptions.ci.plist
          echo '  <key>method</key><string>app-store</string>' >> ios/exportOptions.ci.plist
          echo '  <key>signingStyle</key><string>manual</string>' >> ios/exportOptions.ci.plist
          echo '  <key>provisioningProfiles</key><dict>' >> ios/exportOptions.ci.plist
          echo "    <key>${BUNDLE_ID}</key><string>${PROVISIONING_PROFILE_NAME}</string>" >> ios/exportOptions.ci.plist
          echo '  </dict>' >> ios/exportOptions.ci.plist
          echo '  <key>stripSwiftSymbols</key><true/>' >> ios/exportOptions.ci.plist
          echo '  <key>compileBitcode</key><false/>' >> ios/exportOptions.ci.plist
          echo '  <key>uploadSymbols</key><true/>' >> ios/exportOptions.ci.plist
          echo '</dict></plist>' >> ios/exportOptions.ci.plist
          echo "✅ exportOptions.ci.plist created."

      - name: 📦 Export IPA (Manual Signing)
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          echo "📦 Exporting and signing IPA..."
          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/exportOptions.ci.plist \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$TEAM_ID"
          echo "✅ IPA export complete."

      - name: 🚀 Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          echo "🚀 Uploading to TestFlight..."
          mkdir -p ~/private_keys
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "❌ No IPA found."
            exit 1
          fi
          echo "${APP_STORE_CONNECT_API_KEY}" > ~/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "${APP_STORE_CONNECT_KEY_ID}" \
            --apiIssuer "${APP_STORE_CONNECT_ISSUER_ID}"
          echo "✅ Successfully uploaded to TestFlight."
